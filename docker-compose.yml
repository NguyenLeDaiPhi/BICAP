# BICAP - Main Docker Compose Configuration
# ============================================================
# Bộ chạy chính: services/ + frontend/web/ + MySQL + Kong
# Sử dụng từ thư mục gốc: docker compose up -d --build
# Hoặc chạy từng phần riêng biệt:
#   - make up-infra    : Chỉ infrastructure (DBs, MQ, MinIO, Kong)
#   - make up-services : Backend services và các dependency
#   - make up-apps     : Web apps
#   - make up-dev      : Build và chạy tất cả
# ============================================================

name: bicap

include:
  - docker-compose.base.yml
  - docker-compose.infra.yml
  - docker-compose.services.yml
  - docker-compose.apps.yml

# Để override config cho development, tạo docker-compose.override.yml
# Docker Compose sẽ tự động đọc file này khi chạy `docker compose up`
