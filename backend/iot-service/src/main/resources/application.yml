server:
  port: 8080

spring:
  application:
    name: iot-service
  
  datasource:
    url: jdbc:sqlserver://sqlserver:1433;databaseName=BicapIoTDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: YourStrong@Passw0rd
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: iot-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  
  data:
    redis:
      host: redis
      port: 6379

iot:
  thresholds:
    temperature-min: 15
    temperature-max: 40
    humidity-min: 30
    humidity-max: 95
    ph-min: 5.0
    ph-max: 9.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.bicap: DEBUG
