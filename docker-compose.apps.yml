  # new-app-web:
  #   <<: *web-app-base
  #   build:
  #     context: ./clients/web-app/new-app
  #   container_name: new-app-web
  #   depends_on:
  #     - kong-gateway
  #   environment:
  #     <<: *web-app-env
  #     - JWT_SECRET=your-secret-here
  #   ports:
  #     - "3XXX:3XXX"
  # ============================================================
