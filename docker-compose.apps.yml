# BICAP Web Applications
# Guest Web, Retailer Web, Admin Web, Farm Management Web, Shipping Manager Web, Mobile Apps

# ==================== SHARED ANCHORS ====================
# Template tái sử dụng cho tất cả web apps

x-web-app-base: &web-app-base
  restart: unless-stopped
  networks:
    - bicap-global-net

x-web-app-env: &web-app-env
  AUTH_SERVICE_URL: http://kong-gateway:8000/api/auth
  AUTH_SERVICE_URL_UPDATE: http://kong-gateway:8000/api/update
  NODE_ENV: development
  API_GATEWAY_BASE_URL: http://kong-gateway:8000
  RABBITMQ_URL: amqp://root:root@bicap-message-queue:5672

services:
  # ==================== GUEST WEB ====================
  
  guest-web:
    <<: *web-app-base
    build:
      context: ./clients/web-app/guest-web
    container_name: guest-web
    depends_on:
      - kong-gateway
    environment:
      - NODE_ENV=development
      - PORT=3005
      - AUTH_SERVICE_URL=http://kong-gateway:8000/api/auth
      - TRADING_SERVICE_URL=http://kong-gateway:8000/api/trading
      - BLOCKCHAIN_SERVICE_URL=http://kong-gateway:8000/api/blockchain
      - API_GATEWAY_BASE_URL=http://kong-gateway:8000
    ports:
      - "3005:3005"

  # ==================== RETAILER WEB ====================
  
  retailer-web:
    <<: *web-app-base
    build:
      context: ./clients/web-app/retailer-web
    container_name: retailer-web
    depends_on:
      - kong-gateway
    environment:
      <<: *web-app-env
      - JWT_SECRET_RETAILER=YmljYXAtand0LXJldGFpbGVyLXJvbGUtc2VjcmV0LWtleS1hdXRoISEh
      - FARM_API_URL=http://farm-production-service:8081/api/farm-features
      - MARKETPLACE_API_PATH=http://kong-gateway:8000/api/fetch-marketplace-products
      - FARMING_SEASONS_API_PATH=http://kong-gateway:8000/api/farming-seasons
    ports:
      - "3000:3000"

  # ==================== ADMIN WEB ====================
  
  admin-web:
    <<: *web-app-base
    build:
      context: ./clients/web-app/admin-web
    container_name: admin-web
    depends_on:
      - kong-gateway
      - admin-service
    environment:
      <<: *web-app-env
      - JWT_SECRET_ADMIN=YmljYXAtand0LWFkbWluLXJvbGUtc2VjcmV0LWtleS1hdXRoISEhIQ==
      - FARM_API_URL=http://farm-production-service:8081/api/farm-features
      - MARKETPLACE_API_PATH=http://kong-gateway:8000/api/marketplace-products
      - FARMING_SEASONS_API_PATH=http://kong-gateway:8000/api/farming-seasons
      - ADMIN_SERVICE_URL=http://admin-service:8085
      - TRADING_ORDER_SERVICE_URL=http://trading-order-service:8082
    ports:
      - "3001:3001"

  # ==================== FARM MANAGEMENT WEB ====================
  
  farm-management-web:
    <<: *web-app-base
    build:
      context: ./clients/web-app/farm-management-web
    container_name: farm-management-web
    depends_on:
      - kong-gateway
      - bicap-message-queue
      - image-storage-service
    environment:
      <<: *web-app-env
      - DOCKER_ENV=true
      - JWT_SECRET_FARM=YmljYXAtand0LWZhcm0tcm9sZS1zZWNyZXQta2V5LWF1dGghISEhISEh
      - RABBITMQ_ENABLED=true
      - FARM_API_URL=http://kong-gateway:8000/api/farm-features
      - PRODUCTION_BATCH_API_URL=http://kong-gateway:8000/api/production-batches
      - FARMING_PROCESS_API_URL=http://kong-gateway:8000/api/farming-processes
      - EXPORT_BATCH_API_URL=http://kong-gateway:8000/api/export-batches
      - MARKETPLACE_API_PATH=http://kong-gateway:8000/api/marketplace-products
      - IMAGES_API_PATH=http://kong-gateway:8000/api/images
      - FARMING_SEASONS_API_PATH=http://kong-gateway:8000/api/production-batches
    ports:
      - "3002:3002"

  # ==================== SHIPPING MANAGER WEB ====================
  
  shipping-manager-web:
    <<: *web-app-base
    build:
      context: ./clients/web-app/shipping-manager-web
    container_name: shipping-manager-web
    depends_on:
      - kong-gateway
    environment:
      <<: *web-app-env
      - JWT_SECRET_SHIPPING_MANAGER=YmljYXAtand0LXNoaXBwaW5nLW1nci1yb2xlLXNlY3JldC1rZXkhISEhIQ==
      - FARM_API_URL=http://kong-gateway:8000/api/farm-features
      - MARKETPLACE_API_PATH=http://kong-gateway:8000/api/marketplace-products
      - FARMING_SEASONS_API_PATH=http://kong-gateway:8000/api/farming-seasons
      - SHIPPING_SERVICE_URL=http://kong-gateway:8000/api
      - REACT_APP_SHIPPING_API_URL=http://localhost:8000/api
    ports:
      - "3003:3003"

  # ==================== MOBILE APPS ====================
  
  mobile-driver-app:
    <<: *web-app-base
    build:
      context: ./clients/mobile-app/mobile-ship-driver/bicap-mobile
    container_name: mobile-driver-app
    depends_on:
      - kong-gateway
      - shipping-manager-service
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - NODE_ENV=development
      - API_GATEWAY_URL=http://kong-gateway:8000
      - EXPO_PUBLIC_API_URL=http://kong-gateway:8000
    ports:
      - "8097:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    stdin_open: true
    tty: true

  mobile-ship-driver:
    <<: *web-app-base
    build:
      context: ./clients/mobile-app/mobile-ship-driver/bicap-mobile
    container_name: mobile-ship-driver
    restart: unless-stopped
    depends_on:
      - kong-gateway
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "18081:8081"

  # ============================================================
  # HƯỚNG DẪN THÊM WEB APP MỚI:
  # ============================================================
  # Để thêm web app mới, chỉ cần copy cấu hình dưới đây và sửa:
