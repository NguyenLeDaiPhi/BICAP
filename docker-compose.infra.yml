# BICAP Infrastructure Services
# Databases, Message Queue, Storage, API Gateway

services:
  # ==================== DATABASES ====================
  
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bicap_auth_db
    ports:
      - "3307:3306"
    networks:
      - bicap-global-net
    volumes:
      - ./database/auth-database/bicap_auth_db.sql:/docker-entrypoint-initdb.d/01_bicap_auth_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  farm-production-db:
    image: mysql:8.0
    container_name: farm-production-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=farm_production_db
    ports:
      - "3308:3306"
    networks:
      - bicap-global-net
    volumes:
      - ./database/farm-production-database/bicap_farm_db.sql:/docker-entrypoint-initdb.d/01_bicap_farm_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  trading-order-db:
    image: mysql:8.0
    container_name: trading-order-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bicap_order_db
    ports:
      - "3309:3306"
    networks:
      - bicap-global-net
    volumes:
      - ./database/trading-order-db/bicap_order_db.sql:/docker-entrypoint-initdb.d/01_bicap_order_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  shipping-db:
    image: mysql:8.0
    container_name: shipping-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shipping_db
    ports:
      - "3310:3306"
    networks:
      - bicap-global-net
    volumes:
      - ./database/shipping-db/bicap_shipping_db.sql:/docker-entrypoint-initdb.d/01_bicap_shipping_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  blockchain-db:
    image: mysql:8.0
    container_name: blockchain-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bicap_blockchain_db
    ports:
      - "3311:3306"
    networks:
      - bicap-global-net
    volumes:
      - ./database/blockchain-adapter-database/bicap_blockchain_db_blockchain_records.sql:/docker-entrypoint-initdb.d/01_blockchain_records.sql
      - ./database/blockchain-adapter-database/bicap_blockchain_db_trace_logs.sql:/docker-entrypoint-initdb.d/02_trace_logs.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  image-storage-db:
    image: mysql:8.0
    container_name: image-storage-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=image_storage_db
    ports:
      - "3312:3306"
    networks:
      - bicap-global-net
    volumes:
      - ./database/image-storage-db/image_storage_db.sql:/docker-entrypoint-initdb.d/01_image_storage_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MESSAGE QUEUE ====================
  
  bicap-message-queue:
    image: rabbitmq:3-management
    container_name: bicap-message-queue
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=root
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bicap-global-net

  # ==================== OBJECT STORAGE ====================
  
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - bicap-global-net
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== REDIS ====================
  
  bicap-redis:
    image: redis:7-alpine
    container_name: bicap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bicap-global-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KAFKA ====================
  
  bicap-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bicap-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bicap-global-net

  bicap-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bicap-kafka
    restart: unless-stopped
    depends_on:
      - bicap-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: bicap-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bicap-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bicap-global-net

  # ==================== API GATEWAY ====================
  
  kong-gateway:
    image: kong:latest
    container_name: kong-gateway
    restart: unless-stopped
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LOG_LEVEL=debug  
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - bicap-global-net
    volumes:
      - ./api-gateway/kong.yml:/usr/local/kong/declarative/kong.yml

networks:
  bicap-global-net:
    name: bicap-global-net
    driver: bridge

volumes:
  minio-data:
    name: minio-data
  redis-data:
    name: redis-data
