# BICAP Base Configuration
# Chứa network và volumes dùng chung cho tất cả services
# NOTE: Để chạy riêng lẻ từng file docker-compose, trước tiên cần tạo network:
#   docker network create bicap-global-net 2>/dev/null || true

networks:
  bicap-global-net:
    name: bicap-global-net
    driver: bridge

volumes:
  minio-data:
