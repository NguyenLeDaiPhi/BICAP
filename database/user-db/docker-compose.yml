version: "3.9"
services:
  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "4318:3306"
    volumes:
      - ./bicap_user_db.sql:/docker-entrypoint-initdb.d/01_bicap_user_db.sql
      - user-data:/var/lib/mysql
    networks:
      - bicap-net

  user-service:
    build:
      context: ../../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      - mysql-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8018:8080"
    networks:
      - bicap-net

volumes:
  user-data:

networks:
  bicap-net:
    driver: bridge
