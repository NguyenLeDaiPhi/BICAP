# Server Config
spring.application.name=auth-service
server.port=8080

# SQL Server Database
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=BicapAuthDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Config
bicap.app.jwtExpirationMs=86400000
bicap.app.jwtSecret=YmljYXAtand0LXNlY3JldC1rZXktZm9yLWJpY2FwLXN5c3RlbS1taW5pbXVtLTI1Ni1iaXRz

# Kafka Config
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Redis Config
spring.data.redis.host=redis
spring.data.redis.port=6379

# Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.bicap=DEBUG
