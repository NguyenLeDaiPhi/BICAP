# BICAP Backend Services
# Authentication, Farm Production, Trading Order, Blockchain, Shipping, Admin, Image Storage

x-shared-env: &shared-env
  - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
  - BICAP_APP_JWTSECRET_ADMIN=YmljYXAtand0LWFkbWluLXJvbGUtc2VjcmV0LWtleS1hdXRoISEhIQ==
  - BICAP_APP_JWTSECRET_RETAILER=YmljYXAtand0LXJldGFpbGVyLXJvbGUtc2VjcmV0LWtleS1hdXRoISEh
  - BICAP_APP_JWTSECRET_FARM=YmljYXAtand0LWZhcm0tcm9sZS1zZWNyZXQta2V5LWF1dGghISEhISEh
  - BICAP_APP_JWTSECRET_SHIPPINGMANAGER=YmljYXAtand0LXNoaXBwaW5nLW1nci1yb2xlLXNlY3JldC1rZXkhISEhIQ==
  - BICAP_APP_JWTSECRET_SHIPPINGDRIVER=YmljYXAtand0LXNoaXBwaW5nLWRyaXZlci1yb2xlLXNlY3JldC1rZXkhISEh
  - BICAP_APP_JWTEXPIRATIONMS=86400000
  - SPRING_RABBITMQ_HOST=bicap-message-queue
  - SPRING_RABBITMQ_USERNAME=root
  - SPRING_RABBITMQ_PASSWORD=root

services:
  # ==================== AUTH SERVICE ====================
  
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
    environment:
      - spring.datasource.url=jdbc:mysql://auth-db:3306/bicap_auth_db
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - SPRING_APPLICATION_JSON={"server":{"port":8080}}
    ports:
      - "8088:8080"
    networks:
      - bicap-global-net

  # ==================== FARM PRODUCTION SERVICE ====================
  
  farm-production-service:
    build:
      context: ./services/farm-production-service
    container_name: farm-production-service
    restart: unless-stopped
    depends_on:
      farm-production-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      image-storage-service:
        condition: service_started
    environment:
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - spring.datasource.url=jdbc:mysql://farm-production-db:3306/farm_production_db
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - IMAGE_STORAGE_SERVICE_URL=http://image-storage-service:8086
    ports:
      - "8081:8081"
    networks:
      - bicap-global-net

  # ==================== TRADING ORDER SERVICE ====================
  
  trading-order-service:
    build:
      context: ./services/trading-order-service
    container_name: trading-order-service
    restart: unless-stopped
    depends_on:
      trading-order-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
    environment:
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - spring.datasource.url=jdbc:mysql://trading-order-db:3306/bicap_order_db
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - spring.jpa.hibernate.ddl-auto=update
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    networks:
      - bicap-global-net

  # ==================== BLOCKCHAIN ADAPTER SERVICE ====================
  
  blockchain-adapter-service:
    build:
      context: ./services/blockchain-adapter-service
    container_name: blockchain-adapter-service
    restart: unless-stopped
    depends_on:
      blockchain-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
    environment:
      - spring.datasource.url=jdbc:mysql://blockchain-db:3306/bicap_blockchain_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - SPRING_RABBITMQ_PORT=5672
    ports:
      - "8084:8084"
    networks:
      - bicap-global-net

  # ==================== SHIPPING MANAGER SERVICE ====================
  
  shipping-manager-service:
    build:
      context: ./services/shipping-manager-service
    container_name: shipping-manager-service
    restart: unless-stopped
    depends_on:
      shipping-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      farm-production-service:
        condition: service_started
      blockchain-adapter-service:
        condition: service_started
    environment:
      - spring.datasource.url=jdbc:mysql://shipping-db:3306/shipping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - spring.jpa.hibernate.ddl-auto=update
      - application.config.farm-service-url=http://farm-production-service:8081
      - application.config.blockchain-service-url=http://blockchain-adapter-service:8084
    ports:
      - "8083:8083"
    networks:
      - bicap-global-net

  # ==================== ADMIN SERVICE ====================
  
  admin-service:
    build:
      context: ./services/admin_service
    container_name: admin-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      farm-production-service:
        condition: service_started
      trading-order-service:
        condition: service_started
    environment:
      - spring.datasource.url=jdbc:mysql://auth-db:3306/bicap_auth_db
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - FARM_SERVICE_URL=http://farm-production-service:8081
      - TRADING_ORDER_SERVICE_URL=http://trading-order-service:8082
    ports:
      - "8085:8085"
    networks:
      - bicap-global-net

  # ==================== IMAGE STORAGE SERVICE ====================
  
  image-storage-service:
    build:
      context: ./services/image-storage-service
    container_name: image-storage-service
    restart: unless-stopped
    depends_on:
      image-storage-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - spring.datasource.url=jdbc:mysql://image-storage-db:3306/image_storage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - STORAGE_BUCKET_NAME=bicap-product-images
    ports:
      - "8086:8086"
    networks:
      - bicap-global-net
