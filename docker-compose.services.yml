# BICAP Backend Services
# Authentication, Farm Production, Trading Order, Blockchain, Shipping, Admin, Image Storage

services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    image: bicap/auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://auth-db:3306/bicap_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - SPRING_APPLICATION_JSON={"server":{"port":8080}}
    ports:
      - "8088:8080"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  farm-production-service:
    build:
      context: ./services/farm-production-service
      dockerfile: Dockerfile
    image: bicap/farm-production-service:latest
    container_name: farm-production-service
    restart: unless-stopped
    depends_on:
      farm-production-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      image-storage-service:
        condition: service_started
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://farm-production-db:3306/farm_production_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - IMAGE_STORAGE_SERVICE_URL=http://image-storage-service:8086
    ports:
      - "8081:8081"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  trading-order-service:
    build:
      context: ./services/trading-order-service
      dockerfile: Dockerfile
    image: bicap/trading-order-service:latest
    container_name: trading-order-service
    restart: unless-stopped
    depends_on:
      trading-order-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://trading-order-db:3306/bicap_order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - spring.jpa.hibernate.ddl-auto=update
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  blockchain-adapter-service:
    build:
      context: ./services/blockchain-adapter-service
      dockerfile: Dockerfile
    image: bicap/blockchain-adapter-service:latest
    container_name: blockchain-adapter-service
    restart: unless-stopped
    depends_on:
      blockchain-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      bicap-redis:
        condition: service_started
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://blockchain-db:3306/bicap_blockchain_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - SPRING_REDIS_HOST=bicap-redis
    ports:
      - "8084:8084"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  shipping-manager-service:
    build:
      context: ./services/shipping-manager-service
      dockerfile: Dockerfile
    image: bicap/shipping-manager-service:latest
    container_name: shipping-manager-service
    restart: unless-stopped
    depends_on:
      shipping-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      farm-production-service:
        condition: service_started
      blockchain-adapter-service:
        condition: service_started
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://shipping-db:3306/shipping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - spring.jpa.hibernate.ddl-auto=update
      - application.config.farm-service-url=http://farm-production-service:8081
      - application.config.blockchain-service-url=http://blockchain-adapter-service:8084
    ports:
      - "8083:8083"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin-service:
    build:
      context: ./services/admin_service
      dockerfile: Dockerfile
    image: bicap/admin-service:latest
    container_name: admin-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      bicap-message-queue:
        condition: service_started
      bicap-redis:
        condition: service_started
      farm-production-service:
        condition: service_started
      trading-order-service:
        condition: service_started
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://auth-db:3306/bicap_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - FARM_SERVICE_URL=http://farm-production-service:8081
      - TRADING_ORDER_SERVICE_URL=http://trading-order-service:8082
      - SPRING_REDIS_HOST=bicap-redis
    ports:
      - "8085:8085"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  image-storage-service:
    build:
      context: ./services/image-storage-service
      dockerfile: Dockerfile
    image: bicap/image-storage-service:latest
    container_name: image-storage-service
    restart: unless-stopped
    depends_on:
      image-storage-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - BICAP_APP_JWTSECRET=YmljYXAtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
      - BICAP_APP_JWTEXPIRATIONMS=86400000
      - SPRING_RABBITMQ_HOST=bicap-message-queue
      - SPRING_RABBITMQ_USERNAME=root
      - SPRING_RABBITMQ_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bicap-kafka:9092
      - spring.datasource.url=jdbc:mysql://image-storage-db:3306/image_storage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password=root
      - spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
      - minio.endpoint=http://minio:9000
      - minio.access-key=minioadmin
      - minio.secret-key=minioadmin
      - minio.bucket-name=bicap-product-images
      - minio.presigned-url-expiry=3600
    ports:
      - "8086:8086"
    networks:
      - bicap-global-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  bicap-global-net:
    external: true
